name: Desktop Python research checks
on:
  push:
    branches: [feature/replay-v0.3]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q lab
      - name: 20+ offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline example research run
        run: python -m lab.cli --scenario down --backtest
